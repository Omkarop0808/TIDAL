<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" opacity="0.6">
  <defs>
    <pattern id="topoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="20" cy="20" r="1" fill="#00f2fe" opacity="0.5" />
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1515" stop-opacity="1" />
      <stop offset="100%" stop-color="#0d1515" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#topoGrid)" />
  
  <!-- Simulated topographic lines -->
  <path d="M-100 200 Q 300 400 800 150 T 1500 300" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="5 5" opacity="0.4" />
  <path d="M-50 250 Q 350 450 850 200 T 1550 350" fill="none" stroke="#00f2fe" stroke-width="0.5" opacity="0.2" />
  <path d="M-200 600 Q 400 200 900 800 T 1600 500" fill="none" stroke="#00f2fe" stroke-width="0.5" opacity="0.3" />
  
  <!-- Marker targets -->
  <g transform="translate(400, 300)" opacity="0.5">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#00f2fe" stroke-width="0.5" />
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#00f2fe" stroke-width="0.5" />
  </g>
</svg>
